<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentPay AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
<h1>🤖 AgentPay AI</h1>
<p>Autonomous AI Agent for Secure USDC Payments</p>

<div class="status">
🟢 AI Agent Online
</div>

<input type="text" id="wallet" placeholder="Recipient Wallet Address">

<input type="number" id="amount" placeholder="USDC Amount">

<select id="network">
<option>Base</option>
<option>Ethereum</option>
<option>Solana</option>
</select>

<button onclick="sendPayment()">
Send Payment
</button>

<div id="message"></div>

<h3>Recent Transactions</h3>

<ul id="history">
<li>✅ 10 USDC → 0x7A...F2</li>
<li>✅ 5 USDC → 0x1B...9D</li>
</ul>

</div>

<script src="script.js"></script>

</body>
</html>
