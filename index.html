<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentPay AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🤖 AgentPay AI</h1>
  <p>Autonomous AI USDC Payment Agent</p>

  <div class="card">
    <h2>Wallet Balance</h2>
    <h1>1,250 USDC</h1>
  </div>

  <div class="card">
    <h3>AI Status</h3>
    <p>🟢 Online</p>
  </div>

  <input id="wallet" type="text" placeholder="Recipient Wallet">

  <input id="amount" type="number" placeholder="USDC Amount">

  <button onclick="sendPayment()">Send USDC</button>

  <h3 id="status"></h3>

  <div class="card">
      <h3>AI Activity</h3>
      <ul id="logs">
          <li>Wallet Connected ✅</li>
      </ul>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
