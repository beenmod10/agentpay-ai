<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentPay AI - Autonomous Commerce Stack</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Awesome Icons & Inter Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header Card -->
    <header class="card header-card">
      <div class="brand">
        <i class="fa-solid fa-robot brand-icon"></i>
        <h2>AgentPay AI</h2>
      </div>
      <div class="balance-container">
        <span class="balance-label">Available Balance</span>
        <h1 class="balance-amount">$<span id="userBalance">1,250.00</span> <span>USDC</span></h1>
      </div>
      
      <!-- Wallet Chip with Shortened Address -->
      <div class="wallet-chip" id="walletChip">
        <i class="fa-solid fa-wallet"></i>
        <span id="walletAddressDisplay">0xd402...90b6</span>
        <button id="copyBtn" title="Copy Address"><i class="fa-regular fa-copy"></i></button>
      </div>
    </header>

    <!-- AI Status Badge -->
    <div class="card status-card">
      <div class="status-indicator">
        <span class="dot pulse-green"></span>
        <span class="status-text">AI Status: <strong>Online</strong></span>
      </div>
      <span class="badge-network"><i class="fa-solid fa-network-wired"></i> Mainnet</span>
    </div>

    <!-- Transfer Form Card -->
    <main class="card form-card">
      <div class="input-group">
        <label for="recipientInput"><i class="fa-solid fa-paper-plane"></i> Recipient Address</label>
        <input 
          type="text" 
          id="recipientInput" 
          placeholder="Enter 0x... wallet address"
          value="0x71C...89A"
        />
      </div>

      <div class="input-group">
        <label for="amountInput"><i class="fa-solid fa-coins"></i> Amount (USDC)</label>
        <input 
          type="number" 
          id="amountInput" 
          value="1300" 
          placeholder="0.00" 
        />
      </div>

      <button class="btn-submit" id="sendBtn">
        <span>Send USDC</span>
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
      </button>

      <!-- Alert Box -->
      <div class="alert-box danger" id="alertBox" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation alert-icon"></i>
        <div class="alert-content">
          <strong>Payment Blocked!</strong>
          <p id="alertMessage">High Risk Detected by AI Safety Protocol.</p>
        </div>
      </div>
    </main>

    <!-- Transaction History & Activity Log -->
    <section class="card log-card">
      <div class="history-header">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Transaction History</h3>
        <span class="count-badge" id="txCount">3 Txns</span>
      </div>
      
      <div class="history-list" id="historyList">
        <!-- Javascript will automatically populate dynamic items here -->
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
